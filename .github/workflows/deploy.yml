name: Deploy to orcavia.dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Checkout orcavia.dev site
        uses: actions/checkout@v4
        with:
          repository: orcavia/orcavia.github.io
          token: ${{ secrets.ORCAVIA_PAGES_TOKEN }}
          path: orcavia-site

      - name: Copy build to /easeam
        run: |
          rm -rf orcavia-site/easeam
          mkdir -p orcavia-site/easeam
          cp -a build/. orcavia-site/easeam/
          rm -rf orcavia-site/easeam/Easeam-doc
          if [ -d build/Easeam-doc ]; then
            rm -rf orcavia-site/Easeam-doc
            cp -a build/Easeam-doc orcavia-site/Easeam-doc
          fi

      - name: Publish to orcavia.dev/easeam
        run: |
          cd orcavia-site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet && exit 0
          git commit -m "Deploy Easeam docs"
          git push
